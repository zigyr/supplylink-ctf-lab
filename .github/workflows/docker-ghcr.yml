name: Build & Push to GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      # 构建后先在 CI 里冒烟验证：起容器、等自检、确认门户 A 可访问
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: supplylink-ctf-lab:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (rebinding + portal)
        run: |
          docker run -d --name supplylink -p 8000:8000 supplylink-ctf-lab:ci
          for i in $(seq 1 15); do
            sleep 1
            if docker logs supplylink 2>&1 | grep -q "实验环境已就绪"; then break; fi
          done
          docker logs supplylink
          docker logs supplylink 2>&1 | grep -q "✅ rebinding 工作正常"
          curl -fsS http://127.0.0.1:8000/login.php | grep -q "登录"
          docker rm -f supplylink

      - name: Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
